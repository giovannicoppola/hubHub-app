name: HubHub
options:
  bundleIdPrefix: com.giovannicoppola
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_CFBundleDisplayName: hubHub
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "1.0"
targets:
  HubHub:
    type: application
    platform: iOS
    sources:
      - path: HubHub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.giovannicoppola.hubhub
        DEVELOPMENT_TEAM: VDG762YNX9
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
  HubHubUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: HubHubUITests
    dependencies:
      - target: HubHub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.giovannicoppola.hubhub.uitests
        TEST_TARGET_NAME: HubHub
        GENERATE_INFOPLIST_FILE: YES
  HubHubTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HubHubTests
    dependencies:
      - target: HubHub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.giovannicoppola.hubhub.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/HubHub.app/HubHub"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  HubHub:
    build:
      targets:
        HubHub: all
        HubHubTests: [test]
        HubHubUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HubHubTests
        - HubHubUITests
    archive:
      config: Release
